name: Update Issues

on:
  schedule:
    # 매일 오전 8시 KST
    - cron: "0 23 * * *"
  workflow_dispatch:

concurrency:
  group: update-external-issues
  cancel-in-progress: false

jobs:
  update-issues:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Collect external issues
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          KOBIS_API_KEY: ${{ secrets.KOBIS_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          YOUTUBE_MAX_RESULTS_PER_QUERY: "8"
        run: python collect_issues.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add issue_feed.csv youtube_video_watchlist.csv youtube_video_stats.csv
          git commit -m "Update external issue feed" || echo "No changes to commit"
          git push
