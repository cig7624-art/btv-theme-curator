name: Verify real weekly content refresh

# This paid check refreshes only the latest saved run's content candidates once.
# It never creates themes or retries the click, and never runs on main pushes.
on:
  workflow_dispatch:
  push:
    branches: [codex/theme-titles-v161]
    paths:
      - scripts/verify_weekly_live.py
      - .github/workflows/verify_weekly_live.yml

concurrency:
  group: verify-weekly-live-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-one-content-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Discard stale evidence
        run: rm -f artifacts/weekly_live_validation.json
      - name: Install browser verification driver
        run: python -m pip install playwright
      - name: Prefer the runner's preinstalled browser
        run: |
          weekly_browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$weekly_browser" ]; then
            echo "WEEKLY_CHROMIUM_PATH=$weekly_browser" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Verify single-click and data preservation rules without API calls
        run: python -m unittest discover -s tests -p test_weekly_live_verification.py -v
      - name: Refresh ten titles per existing theme once
        id: verify
        continue-on-error: true
        run: python scripts/verify_weekly_live.py --content-refresh-only
      - name: Preserve sanitized verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-weekly-content-refresh-verification
          path: artifacts/weekly_live_validation.json
          retention-days: 7
      - name: Record sanitized result on this development branch
        if: ${{ always() && !cancelled() && startsWith(github.ref, 'refs/heads/') }}
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if [ ! -f artifacts/weekly_live_validation.json ]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- artifacts/weekly_live_validation.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record real weekly content refresh verification [skip ci]'
          git pull --rebase origin "$TARGET_BRANCH"
          checked_version="$(python -c 'import json; print(json.load(open("artifacts/weekly_live_validation.json"))["expected_version"])')"
          current_version="$(tr -d '[:space:]' < VERSION)"
          if [ "$checked_version" = "$current_version" ]; then
            git push origin HEAD:"$TARGET_BRANCH"
          fi
      - name: Require genuine content refresh validation
        if: ${{ steps.verify.outcome != 'success' }}
        run: exit 1
