name: Inspect public Kinolights title and streaming sources

on:
  workflow_dispatch:
  push:
    branches: [codex/ott-watch-v162]
    paths:
      - scripts/probe_kinolights_public.py
      - scripts/probe_media_topic_archives.py
      - kinolights_availability.py
      - scripts/verify_kinolights_live.py
      - .github/workflows/probe_kinolights_public.yml

jobs:
  inspect-public-content:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public source inspection tools
        run: python -m pip install requests beautifulsoup4 pandas
      - name: Verify the normal public title and service client
        run: python scripts/verify_kinolights_live.py
      - name: Retain sanitized source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kinolights-public-content-evidence
          path: |
            artifacts/kinolights_public_probe/
            artifacts/topic_archive_probe.json
            artifacts/kinolights_live_verification.json
          retention-days: 3
      - name: Record sanitized evidence on the development branch
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- artifacts/kinolights_live_verification.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record public Kinolights content source evidence [skip ci]'
          for attempt in 1 2 3; do
            git pull --rebase origin "$TARGET_BRANCH"
            if git push origin HEAD:"$TARGET_BRANCH"; then exit 0; fi
          done
          exit 1
