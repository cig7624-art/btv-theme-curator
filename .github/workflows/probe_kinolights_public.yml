name: Inspect public Kinolights title and streaming sources

on:
  workflow_dispatch:
  push:
    branches: [codex/ott-watch-v162]
    paths:
      - scripts/probe_kinolights_public.py
      - .github/workflows/probe_kinolights_public.yml

jobs:
  inspect-public-content:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public source inspection tools
        run: python -m pip install requests beautifulsoup4 playwright
      - name: Select existing browser
        run: |
          public_probe_browser="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$public_probe_browser" ]; then
            echo "PUBLIC_PROBE_BROWSER=$public_probe_browser" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Inspect logged-out public searches and content responses
        run: python scripts/probe_kinolights_public.py --browser --chromium-path "${PUBLIC_PROBE_BROWSER:-}"
      - name: Retain sanitized source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kinolights-public-content-evidence
          path: artifacts/kinolights_public_probe/
          retention-days: 3
      - name: Record sanitized evidence on the development branch
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- artifacts/kinolights_public_probe/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record public Kinolights content source evidence [skip ci]'
          for attempt in 1 2 3; do
            git pull --rebase origin "$TARGET_BRANCH"
            if git push origin HEAD:"$TARGET_BRANCH"; then exit 0; fi
          done
          exit 1
