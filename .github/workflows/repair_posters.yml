name: Repair saved theme posters

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - poster_assets.py
      - scripts/repair_theme_posters.py
      - scripts/audit_candidate_identity.py
      - .github/workflows/repair_posters.yml

concurrency:
  group: repair-saved-theme-posters
  cancel-in-progress: false

jobs:
  repair-posters:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install packages
        run: pip install -r requirements-dev.txt
      - name: Validate poster repair
        run: python -m unittest discover -s tests -v
      - name: Audit ambiguous candidate identities using public metadata only
        run: python scripts/audit_candidate_identity.py
      - name: Preserve public identity evidence
        uses: actions/upload-artifact@v4
        with:
          name: candidate-identity-audit
          path: artifacts/candidate_identity_audit.json
      - name: Look up existing titles without generating new recommendations
        run: python scripts/repair_theme_posters.py --collect /tmp/theme-poster-updates.json --limit 100 --per-theme 10 --check-existing --diagnose
      - name: Save image validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: theme-poster-validation
          path: /tmp/theme-poster-updates.json
      - name: Refresh saved recommendations before applying poster-only changes
        run: git pull --ff-only origin main
      - name: Apply matching poster repairs
        run: python scripts/repair_theme_posters.py --apply /tmp/theme-poster-updates.json --write
      - name: Commit repaired poster addresses
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add theme_content_candidates.csv artifacts/poster_repair_status.json artifacts/candidate_identity_audit.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Repair saved theme poster addresses"
          git push
