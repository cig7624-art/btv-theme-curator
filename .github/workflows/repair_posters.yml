name: Repair saved theme posters

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - poster_assets.py
      - scripts/repair_theme_posters.py
      - .github/workflows/repair_posters.yml

concurrency:
  group: repair-saved-theme-posters
  cancel-in-progress: false

jobs:
  repair-posters:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install packages
        run: pip install -r requirements.txt
      - name: Validate poster repair
        run: python -m unittest discover -s tests -v
      - name: Look up existing titles without generating new recommendations
        run: python scripts/repair_theme_posters.py --collect /tmp/theme-poster-updates.json --diagnose
      - name: Refresh saved recommendations before applying poster-only changes
        run: git pull --ff-only origin main
      - name: Apply matching missing artwork
        run: python scripts/repair_theme_posters.py --apply /tmp/theme-poster-updates.json --write
      - name: Commit repaired poster addresses
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add theme_content_candidates.csv artifacts/poster_repair_status.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Repair saved theme poster addresses"
          git push
