name: Probe official media business sources

on:
  workflow_dispatch:
  push:
    branches: [codex/media-insights]
    paths:
      - scripts/probe_media_sources.py
      - .github/workflows/probe_media_sources.yml

jobs:
  probe-public-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4 playwright
      - name: Use the hosted browser for dynamic quarterly document links
        run: |
          media_browser="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$media_browser" ]; then echo "MEDIA_PROBE_CHROMIUM=$media_browser" >> "$GITHUB_ENV"; fi
      - name: Inspect public official sources without model calls
        run: python scripts/probe_media_sources.py
      - uses: actions/upload-artifact@v4
        with:
          name: official-media-source-probe
          path: artifacts/media_source_probe.json
          retention-days: 7
      - name: Record public source evidence on the development branch
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- artifacts/media_source_probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record official media source availability [skip ci]'
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin HEAD:"$TARGET_BRANCH"
