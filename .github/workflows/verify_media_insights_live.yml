name: Verify real media insights analysis

# Verify two previously generated real notes and one new research question.
# Validate real source notes after waking the app and confirming the deployed version.
# Existing analyses are reused; this run never regenerates or replaces them.
# No schedules, ordinary deployment triggers, or retries after paid clicks.
on:
  workflow_dispatch:
  push:
    branches: [codex/media-insights-live]
    paths:
      - scripts/verify_media_insights_live.py
      - .github/workflows/verify_media_insights_live.yml

concurrency:
  group: verify-media-insights-live-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-launch-analysis-and-question:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require the new release and discard stale evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          Path('artifacts/media_insights_live_validation.json').unlink(missing_ok=True)
          match = re.fullmatch(r'(\d+)\.(\d+)\.(\d+)(?:[-+].*)?', Path('VERSION').read_text().strip())
          if not match or tuple(map(int, match.groups())) < (1, 3, 0):
              raise SystemExit('Media insights release 1.3.0 or later is required')
          PY
      - name: Install lightweight browser driver
        run: python -m pip install playwright
      - name: Prefer the runner's preinstalled browser
        run: |
          media_insights_browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$media_insights_browser" ]; then
            echo "MEDIA_INSIGHTS_CHROMIUM_PATH=$media_insights_browser" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Verify paid-action and public-persistence rules without model calls
        run: python -m unittest discover -s tests -p 'test_media_insights_live_verification.py' -v
      - name: Verify saved genuine analyses and one cited research answer
        id: verify
        continue-on-error: true
        run: python scripts/verify_media_insights_live.py --analysis-limit 2 --reuse-analyses
      - name: Preserve sanitized counts and checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-media-insights-live-validation
          path: artifacts/media_insights_live_validation.json
          retention-days: 7
      - name: Record sanitized result on this branch
        if: ${{ always() && !cancelled() && startsWith(github.ref, 'refs/heads/') }}
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if [ ! -f artifacts/media_insights_live_validation.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- artifacts/media_insights_live_validation.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record real media insights verification [skip ci]'
          git pull --rebase origin "$TARGET_BRANCH"
          checked_version="$(python -c 'import json; print(json.load(open("artifacts/media_insights_live_validation.json"))["expected_version"])')"
          current_version="$(tr -d '[:space:]' < VERSION)"
          if [ "$checked_version" != "$current_version" ]; then
            echo 'A newer release superseded this verification.'
            exit 0
          fi
          git push origin HEAD:"$TARGET_BRANCH"
      - name: Require the genuine analysis and question to pass
        if: ${{ steps.verify.outcome != 'success' }}
        run: exit 1
