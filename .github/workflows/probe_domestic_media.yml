name: Probe official domestic products and media images

on:
  workflow_dispatch:
  push:
    branches: [codex/media-magazine]
    paths:
      - scripts/probe_domestic_media.py
      - .github/workflows/probe_domestic_media.yml

jobs:
  inspect-public-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4
      - run: python scripts/probe_domestic_media.py
      - name: Preserve public source evidence on this development branch
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- artifacts/domestic_media_probe_current.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record official product and image source availability [skip ci]'
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin HEAD:"$TARGET_BRANCH"
