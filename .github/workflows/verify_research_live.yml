name: Verify real business research and encrypted memory

# Two paid submissions at most, after the exact public release is ready.
# Ordinary main deployment runs only the separate read-only verifier.
on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Exact public release to verify (blank uses VERSION)
        type: string
        default: ''
  push:
    branches: [codex/business-research]
    paths:
      - scripts/verify_research_live.py
      - .github/workflows/verify_research_live.yml

concurrency:
  group: verify-business-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-business-research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Remove stale evidence and verify once-only paid actions
        run: |
          rm -f artifacts/research_live_validation.json
          python -m unittest discover -s tests -p 'test_research_live_verification.py' -v
      - name: Install browser driver
        run: python -m pip install playwright
      - name: Prefer the runner's existing browser
        run: |
          research_browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$research_browser" ]; then
            echo "RESEARCH_CHROMIUM_PATH=$research_browser" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Submit two real questions and recover encrypted project
        id: verify
        continue-on-error: true
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version || '' }}
        run: |
          research_args=(--timeout 480 --response-timeout 180)
          if [ -n "$EXPECTED_VERSION" ]; then
            research_args+=(--expected-version "$EXPECTED_VERSION")
          fi
          python scripts/verify_research_live.py "${research_args[@]}"
      - name: Preserve sanitized live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-business-research-validation
          path: artifacts/research_live_validation.json
          retention-days: 7
      - name: Record sanitized result on this branch
        if: ${{ always() && !cancelled() && github.ref == 'refs/heads/codex/business-research' }}
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if [ ! -f artifacts/research_live_validation.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- artifacts/research_live_validation.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record real business research and memory verification [skip ci]'
          git pull --rebase origin "$TARGET_BRANCH"
          validation_version="$(python -c 'import json; print(json.load(open("artifacts/research_live_validation.json"))["expected_version"])')"
          current_version="$(tr -d '[:space:]' < VERSION)"
          if [ "$validation_version" != "$current_version" ]; then exit 0; fi
          git push origin HEAD:"$TARGET_BRANCH"
      - name: Require genuine research and recovery to pass
        if: ${{ steps.verify.outcome != 'success' }}
        run: exit 1
