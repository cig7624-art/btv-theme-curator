name: Verify public OTT homes

on:
  workflow_dispatch:
    inputs:
      capture_evidence:
        description: 'Capture detailed public DOM/API evidence for source debugging'
        type: boolean
        default: false
  push:
    branches: [codex/ott-public-home]
    paths:
      - scripts/probe_ott_public.py
      - scripts/collect_ott.py
      - scripts/check_ott_images.py
      - ott_collection.py
      - ott_public_sources.py
      - ott_source_adapters.py
      - coupang_public.py
      - .github/workflows/verify_ott_public.yml

concurrency:
  group: verify-public-ott-homes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-public-homes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install collection packages
        run: python -m pip install requests beautifulsoup4 playwright
      - name: Use the hosted runner's existing browser when available
        run: |
          collection_browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$collection_browser" ]; then
            echo "OTT_COLLECTION_CHROMIUM_PATH=$collection_browser" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Inspect public homepage documents
        if: ${{ inputs.capture_evidence == true || hashFiles('scripts/collect_ott.py') == '' }}
        run: python scripts/probe_ott_public.py
      - name: Exercise public homepage collector
        if: ${{ hashFiles('scripts/collect_ott.py') != '' }}
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -n "${OTT_COLLECTION_CHROMIUM_PATH:-}" ]; then
            python scripts/collect_ott.py --browser --require-home --output ott_home_snapshot.json --chromium-path "$OTT_COLLECTION_CHROMIUM_PATH"
          else
            python scripts/collect_ott.py --browser --require-home --output ott_home_snapshot.json
          fi
      - name: Verify all saved public artwork
        if: ${{ hashFiles('ott_home_snapshot.json') != '' }}
        run: python scripts/check_ott_images.py --all
      - name: Upload public evidence including screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-ott-home-evidence
          path: |
            artifacts/ott_public_probe/
            ott_home_snapshot.json
            artifacts/ott_asset_validation.json
          retention-days: 7
      - name: Record public evidence on the development branch
        if: ${{ always() && github.ref == 'refs/heads/codex/ott-public-home' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for output in artifacts/ott_public_probe/summary.json artifacts/ott_asset_validation.json; do
            if [ -f "$output" ]; then
              git add -- "$output"
            fi
          done
          if [ -f ott_home_snapshot.json ]; then
            git add -- ott_home_snapshot.json
          fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record public OTT home verification [skip ci]'
          git pull --rebase origin codex/ott-public-home
          git push origin HEAD:codex/ott-public-home
