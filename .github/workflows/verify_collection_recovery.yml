name: Verify collection recovery without AI requests

on:
  workflow_dispatch:
    inputs:
      refresh_daily_issues:
        description: Re-run the skipped daily collection once (YouTube API quota, no AI generation)
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [.github/workflows/verify_collection_recovery.yml]

jobs:
  inspect-public-korean-presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the public read-only browser driver
        run: python -m pip install playwright streamlit==1.66.0
      - name: Select the existing browser
        run: |
          recovery_browser="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$recovery_browser" ]; then
            echo "RECOVERY_CHROMIUM_PATH=$recovery_browser" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Inspect pending presentation without submitting translation
        id: inspect
        continue-on-error: true
        run: |
          if [ -n "${RECOVERY_CHROMIUM_PATH:-}" ]; then
            python scripts/localize_media_live.py --check-only --timeout 120 --executable "$RECOVERY_CHROMIUM_PATH" --output artifacts/media_localization_readonly_validation.json
          else
            python scripts/localize_media_live.py --check-only --timeout 120 --output artifacts/media_localization_readonly_validation.json
          fi
      - name: Record only sanitized read-only results
        if: ${{ always() && !cancelled() }}
        run: |
          if [ ! -f artifacts/media_localization_readonly_validation.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- artifacts/media_localization_readonly_validation.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record read-only Korean presentation recovery [skip ci]'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - name: Require successful public inspection
        if: ${{ steps.inspect.outcome != 'success' }}
        run: exit 1
      - name: Recover the skipped daily collection once
        if: ${{ steps.inspect.outcome == 'success' && (github.event_name == 'push' || inputs.refresh_daily_issues) }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run update_issues.yml --ref main -f news_only=false
