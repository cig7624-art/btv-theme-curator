name: Collect official media insights

on:
  schedule:
    # 매일 오전 9시 KST (UTC 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main, codex/media-insights, codex/media-magazine]
    paths:
      - media_insights_collection.py
      - media_insights_localization.py
      - domestic_product_sources.py
      - scripts/collect_media_insights.py
      - scripts/localize_media_live.py
      - .github/workflows/update_media_insights.yml

concurrency:
  group: collect-media-insights-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect-official-documents:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official document and optional analysis packages
        run: python -m pip install requests beautifulsoup4 pypdf==6.21.2 openai pydantic
      - name: Verify collection and concurrent snapshot preservation
        run: |
          python -m unittest discover -s tests -p 'test_media_insights_collection.py' -v
          python -m unittest discover -s tests -p 'test_media_insights_storage.py' -v
      - name: Collect documents and safely merge the snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_BRANCH: ${{ github.ref_name }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: python scripts/collect_media_insights.py --output media_insights_snapshot.json --max-documents 48 --analyze-limit 2
      - name: Preserve collection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-media-insights-snapshot
          path: media_insights_snapshot.json
          if-no-files-found: warn
          retention-days: 14

  cache-korean-presentation:
    needs: collect-official-documents
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install playwright
      - name: Use the existing browser
        run: |
          media_browser="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$media_browser" ]; then
            echo "MEDIA_CHROMIUM_PATH=$media_browser" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Cache new English titles once through the deployed app
        run: |
          if [ -n "${MEDIA_CHROMIUM_PATH:-}" ]; then
            python scripts/localize_media_live.py --executable "$MEDIA_CHROMIUM_PATH" ${{ github.event_name == 'push' && '--max-batches 2' || '' }}
          else
            python scripts/localize_media_live.py ${{ github.event_name == 'push' && '--max-batches 2' || '' }}
          fi
      - name: Record translation action outcome
        if: always()
        run: |
          if [ ! -f artifacts/media_localization_validation.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- artifacts/media_localization_validation.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record cached Korean media presentation status [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
