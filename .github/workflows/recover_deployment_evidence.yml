name: Recover sanitized public deployment evidence

on:
  workflow_dispatch:
  push:
    branches: [codex/ott-watch-v162]
    paths: [.github/workflows/recover_deployment_evidence.yml]

jobs:
  recover-public-report:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download the already sanitized public verification report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run download 40449832021 --name public-streamlit-deployment-verification --dir /tmp/deployment-evidence
          cp /tmp/deployment-evidence/deployment_validation.json artifacts/recovered_deployment_validation.json
      - name: Record only the sanitized JSON on the development branch
        if: ${{ github.ref == 'refs/heads/codex/ott-watch-v162' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- artifacts/recovered_deployment_validation.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Recover sanitized public browser check [skip ci]'
          git pull --rebase origin codex/ott-watch-v162
          git push origin HEAD:codex/ott-watch-v162
